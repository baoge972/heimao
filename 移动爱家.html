<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动爱家 - 密码登录</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .container{max-width:400px;width:100%;background:#fff;border-radius:24px;padding:30px;box-shadow:0 10px 30px -10px rgba(0,0,0,0.1)}
        h1{font-size:24px;font-weight:700;color:#0f172a;margin-bottom:8px}
        .subtitle{color:#64748b;font-size:14px;margin-bottom:24px;border-bottom:1px solid #e2e8f0;padding-bottom:16px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:4px}
        .form-group input{width:100%;padding:12px 16px;border:1px solid #e2e8f0;border-radius:12px;font-size:15px;background:#f8fafc}
        .form-group input:focus{outline:none;border-color:#3b82f6;background:#fff}
        .btn{width:100%;padding:14px;background:#3b82f6;color:#fff;font-size:16px;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:background .2s;margin-top:8px}
        .btn:hover{background:#2563eb}
        .btn:disabled{opacity:.6;cursor:not-allowed}
        .hidden{display:none}
        .error{background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:12px;font-size:14px;margin-top:12px;border:1px solid #fecaca}
        .success{background:#dcfce7;color:#166534;padding:12px 16px;border-radius:12px;font-size:14px;margin-top:12px;border:1px solid #bbf7d0}
        .device-card{background:#f8fafc;padding:16px;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:12px}
        .device-card .name{font-weight:600;font-size:16px;color:#0f172a}
        .device-card .detail{font-size:14px;color:#475569;margin-top:4px}
        .device-card .status{display:inline-block;font-size:12px;font-weight:600;padding:2px 12px;border-radius:20px;margin-top:8px}
        .status.online{background:#dcfce7;color:#166534}
        .status.offline{background:#fee2e2;color:#991b1b}
        .loading{text-align:center;color:#64748b;padding:20px 0}
        .footer{margin-top:20px;font-size:12px;color:#94a3b8;text-align:center;border-top:1px solid #e2e8f0;padding-top:16px}
    </style>
</head>
<body>

<div class="container">
    <h1>🏠 移动爱家</h1>
    <div class="subtitle">密码登录</div>

    <div id="loginSection">
        <div class="form-group">
            <label>手机号</label>
            <input type="text" id="phone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button class="btn" id="loginBtn">登录</button>
        <div id="messageBox"></div>
    </div>

    <div id="deviceSection" class="hidden">
        <div id="deviceList"></div>
        <div class="footer">数据来源：移动爱家</div>
    </div>

    <div id="loadingState" class="loading hidden">⏳ 加载中...</div>
</div>

<script>
// ============================================================
// 🔐 SHA1 加密函数
// ============================================================
function sha1(input) {
    function rotateLeft(n, s) { return (n << s) | (n >>> (32 - s)); }
    function toHexStr(n) { var s = ''; for (var i = 7; i >= 0; i--) { s += ((n >>> (i * 4)) & 0x0f).toString(16); } return s; }
    
    var block = [];
    var h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
    var msg = unescape(encodeURIComponent(input));
    var ml = msg.length * 8;
    for (var i = 0; i < msg.length; i++) { block[i >>> 2] |= (msg.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8); }
    block[i >>> 2] |= 0x80 << (24 - (i % 4) * 8);
    block[(((i + 64) >>> 9) << 4) + 14] = ml;
    
    for (var blockStart = 0; blockStart < block.length; blockStart += 16) {
        var w = new Array(80);
        for (var j = 0; j < 16; j++) w[j] = block[blockStart + j] || 0;
        for (var j = 16; j < 80; j++) w[j] = rotateLeft(w[j - 3] ^ w[j - 8] ^ w[j - 14] ^ w[j - 16], 1);
        var a = h0, b = h1, c = h2, d = h3, e = h4;
        for (var j = 0; j < 80; j++) {
            var f, k;
            if (j < 20) { f = (b & c) | ((~b) & d); k = 0x5A827999; }
            else if (j < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
            else if (j < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
            else { f = b ^ c ^ d; k = 0xCA62C1D6; }
            var temp = (rotateLeft(a, 5) + f + e + k + w[j]) & 0xffffffff;
            e = d; d = c; c = rotateLeft(b, 30); b = a; a = temp;
        }
        h0 = (h0 + a) & 0xffffffff;
        h1 = (h1 + b) & 0xffffffff;
        h2 = (h2 + c) & 0xffffffff;
        h3 = (h3 + d) & 0xffffffff;
        h4 = (h4 + e) & 0xffffffff;
    }
    return toHexStr(h0) + toHexStr(h1) + toHexStr(h2) + toHexStr(h3) + toHexStr(h4);
}

// ============================================================
// 🔑 生成随机 requestid（纯数学，不用任何浏览器API）
// ============================================================
function getRequestId() {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var result = '';
    for (var i = 0; i < 16; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

// ============================================================
// 🔑 核心签名函数
// ============================================================
function generateSign(token, timestamp, requestid, param) {
    var signStr = token + timestamp + requestid + param;
    return sha1(signStr).toUpperCase();
}

// ============================================================
// 📡 登录函数
// ============================================================
async function login(phone, password) {
    var DOMAIN = 'https://andlink.komect.com';
    var POWERKEY = '0f4ccee8ddfc426e8faedbf83462bf34';
    
    var timestamp = Date.now().toString();
    var requestid = getRequestId();
    var param = JSON.stringify({ phone: phone, password: password, appKey: POWERKEY });
    
    var signature = generateSign(POWERKEY, timestamp, requestid, param);
    
    var response = await fetch(DOMAIN + '/espapi/cloud/json/loginByApp', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'powerkey': POWERKEY,
            'timestamp': timestamp,
            'requestid': requestid,
            'signature': signature
        },
        body: param
    });
    
    return await response.json();
}

// ============================================================
// 📡 获取设备列表
// ============================================================
async function getDeviceList(token, powerkey) {
    var DOMAIN = 'https://andlink.komect.com';
    var timestamp = Date.now().toString();
    var requestid = getRequestId();
    var param = JSON.stringify({});
    var signature = generateSign(token, timestamp, requestid, param);
    
    var response = await fetch(DOMAIN + '/espapi/cloud/json/getDeviceList', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'powerkey': powerkey,
            'timestamp': timestamp,
            'requestid': requestid,
            'signature': signature,
            'token': token
        },
        body: param
    });
    
    return await response.json();
}

// ============================================================
// 🖥️ UI 交互
// ============================================================
var phoneInput = document.getElementById('phone');
var passwordInput = document.getElementById('password');
var loginBtn = document.getElementById('loginBtn');
var messageBox = document.getElementById('messageBox');
var loginSection = document.getElementById('loginSection');
var deviceSection = document.getElementById('deviceSection');
var deviceList = document.getElementById('deviceList');
var loadingState = document.getElementById('loadingState');

function showMsg(text, type) {
    messageBox.className = type === 'error' ? 'error' : 'success';
    messageBox.textContent = text;
    messageBox.classList.remove('hidden');
}

function hideMsg() {
    messageBox.classList.add('hidden');
}

loginBtn.addEventListener('click', async function() {
    var phone = phoneInput.value.trim();
    var password = passwordInput.value.trim();
    
    if (!phone || !/^1\d{10}$/.test(phone)) {
        showMsg('请输入正确的手机号', 'error');
        return;
    }
    if (!password || password.length < 6) {
        showMsg('请输入密码（至少6位）', 'error');
        return;
    }
    
    hideMsg();
    this.disabled = true;
    this.textContent = '登录中...';
    loadingState.classList.remove('hidden');
    
    try {
        var loginResult = await login(phone, password);
        
        if (loginResult.code !== 0 && loginResult.status !== 0) {
            throw new Error(loginResult.msg || loginResult.message || '登录失败，请检查账号密码');
        }
        
        var token = loginResult.data && loginResult.data.jsessionid ? loginResult.data.jsessionid : (loginResult.data && loginResult.data.token ? loginResult.data.token : null);
        if (!token) {
            throw new Error('未获取到登录凭证');
        }
        
        var POWERKEY = '0f4ccee8ddfc426e8faedbf83462bf34';
        var deviceResult = await getDeviceList(token, POWERKEY);
        
        if (deviceResult.code !== 0 && deviceResult.status !== 0) {
            throw new Error(deviceResult.msg || deviceResult.message || '获取设备列表失败');
        }
        
        var devices = deviceResult.data || deviceResult.devices || [];
        
        loadingState.classList.add('hidden');
        loginSection.classList.add('hidden');
        deviceSection.classList.remove('hidden');
        
        if (!devices || devices.length === 0) {
            deviceList.innerHTML = '<div style="text-align:center;color:#64748b;padding:20px;">暂无设备</div>';
            return;
        }
        
        deviceList.innerHTML = '';
        for (var i = 0; i < devices.length; i++) {
            var dev = devices[i];
            var name = dev.name || dev.deviceName || dev.nickname || '未知设备';
            var status = (dev.online === true || dev.status === 'online' || dev.online === 1) ? 'online' : 'offline';
            var statusText = status === 'online' ? '在线' : '离线';
            var location = dev.location || dev.roomName || dev.area || '未设置';
            var card = document.createElement('div');
            card.className = 'device-card';
            card.innerHTML = '<div class="name">' + name + '</div><div class="detail">📍 ' + location + '</div><div class="status ' + status + '">' + statusText + '</div>';
            deviceList.appendChild(card);
        }
        
    } catch (err) {
        loadingState.classList.add('hidden');
        showMsg('❌ ' + (err.message || '登录失败，请重试'), 'error');
        this.disabled = false;
        this.textContent = '登录';
    }
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loginBtn.click();
});
</script>

</body>
</html>
