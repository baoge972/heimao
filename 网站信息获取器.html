<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站信息获取器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .input-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .input-group input {
            flex: 1; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 16px; transition: all 0.3s; outline: none;
        }
        .input-group input:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,0.1); }
        .input-group input:disabled { background: #f5f5f5; cursor: not-allowed; }
        .btn {
            padding: 14px 30px; background: #667eea; color: white; border: none;
            border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; white-space: nowrap;
        }
        .btn:hover:not(:disabled) { background: #5a6fd6; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .status { text-align: center; padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; display: none; }
        .status.loading { display: block; background: #e3f2fd; color: #1976d2; }
        .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .status.error { display: block; background: #ffebee; color: #c62828; }
        .result { display: none; animation: slideUp 0.5s ease; }
        .result.show { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .result-item { margin-bottom: 20px; }
        .result-item label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-item .value { padding: 12px 16px; background: #f8f9fa; border-radius: 10px; border: 1px solid #e0e0e0; word-break: break-all; min-height: 44px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .result-item .value .icon-preview { width: 32px; height: 32px; flex-shrink: 0; border-radius: 6px; object-fit: contain; background: white; border: 1px solid #e0e0e0; padding: 4px; }
        .result-item .value .empty { color: #999; font-style: italic; }
        .preview-section { margin-top: 30px; padding-top: 20px; border-top: 2px dashed #e0e0e0; }
        .preview-card { display: flex; gap: 20px; padding: 20px; background: #f8f9fa; border-radius: 12px; border: 1px solid #e0e0e0; align-items: center; }
        .preview-card .favicon { width: 48px; height: 48px; border-radius: 8px; object-fit: contain; background: white; padding: 6px; border: 1px solid #e0e0e0; flex-shrink: 0; }
        .preview-card .info { flex: 1; min-width: 0; }
        .preview-card .info .title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 4px; }
        .preview-card .info .url { font-size: 13px; color: #667eea; margin-bottom: 4px; word-break: break-all; }
        .preview-card .info .desc { font-size: 14px; color: #666; line-height: 1.5; }
        .preview-placeholder { text-align: center; color: #999; padding: 30px 0; }
        .preview-placeholder .icon { font-size: 48px; margin-bottom: 10px; opacity: 0.3; }
        .badge { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 11px; padding: 2px 10px; border-radius: 12px; margin-left: 8px; }
        @media (max-width: 600px) { .container { padding: 20px; } .input-group { flex-direction: column; } .btn { width: 100%; justify-content: center; } .preview-card { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 网站信息获取器</h1>
        <p class="subtitle">输入网址，自动提取标题、描述和图标</p>

        <div class="input-group">
            <input
                type="url"
                id="urlInput"
                placeholder="请输入网址，例如：https://github.com"
                autocomplete="off"
            />
            <button class="btn" id="fetchBtn">🚀 获取信息</button>
        </div>

        <div class="status" id="status"></div>

        <div class="result" id="result">
            <div class="preview-section">
                <div id="previewCard">
                    <div class="preview-placeholder">
                        <div class="icon">🌐</div>
                        <p>输入网址后点击获取</p>
                    </div>
                </div>
            </div>
            <div class="result-item">
                <label>📌 标题</label>
                <div class="value" id="titleDisplay">
                    <span class="empty">未获取</span>
                </div>
            </div>
            <div class="result-item">
                <label>📝 描述</label>
                <div class="value" id="descDisplay">
                    <span class="empty">未获取</span>
                </div>
            </div>
            <div class="result-item">
                <label>🖼️ 图标地址</label>
                <div class="value" id="iconDisplay">
                    <span class="empty">未获取</span>
                </div>
            </div>
            <div class="result-item">
                <label>🌍 原始链接</label>
                <div class="value" id="urlDisplay">
                    <span class="empty">未获取</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DOM 元素
        // ============================================
        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        const titleDisplay = document.getElementById('titleDisplay');
        const descDisplay = document.getElementById('descDisplay');
        const iconDisplay = document.getElementById('iconDisplay');
        const urlDisplay = document.getElementById('urlDisplay');
        const previewCard = document.getElementById('previewCard');

        // ============================================
        // 页面加载时确保输入框为空
        // ============================================
        window.addEventListener('DOMContentLoaded', function() {
            urlInput.value = '';
        });

        // ============================================
        // 左键点击：清空输入框
        // ============================================
        urlInput.addEventListener('click', function(e) {
            this.value = '';
        });

        // ============================================
        // 右键点击：先清空，然后弹出右键菜单（粘贴）
        // ============================================
        urlInput.addEventListener('contextmenu', function(e) {
            this.value = '';
            // 不阻止默认行为，让右键菜单正常弹出
        });

        // ============================================
        // 回车键触发获取
        // ============================================
        urlInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                fetchInfo();
            }
        });

        // ============================================
        // 点击获取按钮
        // ============================================
        fetchBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            fetchInfo();
        });

        // ============================================
        // 核心函数
        // ============================================
        async function fetchInfo() {
            const url = urlInput.value.trim();

            if (!url) {
                showStatus('⚠️ 请输入网址', 'error');
                return;
            }

            let targetUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                targetUrl = 'https://' + url;
                urlInput.value = targetUrl;
            }

            try {
                new URL(targetUrl);
            } catch {
                showStatus('❌ 网址格式不正确', 'error');
                return;
            }

            fetchBtn.disabled = true;
            urlInput.disabled = true;
            resultEl.classList.remove('show');
            showStatus('⏳ 正在获取网站信息...', 'loading');

            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

                const response = await fetch(proxyUrl, {
                    signal: AbortSignal.timeout(15000)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const html = await response.text();

                if (!html || html.length < 50) {
                    throw new Error('获取到的页面内容为空');
                }

                const info = parseHTML(html, targetUrl);
                displayResult(info, targetUrl);
                showStatus('✅ 获取成功！', 'success');

            } catch (error) {
                console.error('获取失败:', error);
                const fallbackInfo = {
                    title: '获取失败: ' + error.message,
                    description: '请检查网址是否可访问，或尝试其他网站',
                    icon: getFaviconUrl(targetUrl),
                    url: targetUrl
                };
                displayResult(fallbackInfo, targetUrl);
                showStatus('❌ ' + error.message, 'error');
            } finally {
                fetchBtn.disabled = false;
                urlInput.disabled = false;
            }
        }

        // ============================================
        // HTML 解析器
        // ============================================
        function parseHTML(html, baseUrl) {
            let title = '', description = '', iconUrl = '';

            const titlePatterns = [
                /<meta[^>]*property=["']og:title["'][^>]*content=["']([^"']*)["'][^>]*>/i,
                /<meta[^>]*name=["']twitter:title["'][^>]*content=["']([^"']*)["'][^>]*>/i,
                /<meta[^>]*name=["']title["'][^>]*content=["']([^"']*)["'][^>]*>/i,
                /<title[^>]*>([^<]*)<\/title>/i,
                /<h1[^>]*>([^<]*)<\/h1>/i,
            ];
            for (const p of titlePatterns) {
                const m = html.match(p);
                if (m && m[1].trim()) {
                    title = m[1].trim();
                    break;
                }
            }

            const descPatterns = [
                /<meta[^>]*property=["']og:description["'][^>]*content=["']([^"']*)["'][^>]*>/i,
                /<meta[^>]*name=["']twitter:description["'][^>]*content=["']([^"']*)["'][^>]*>/i,
                /<meta[^>]*name=["']description["'][^>]*content=["']([^"']*)["'][^>]*>/i,
                /<p[^>]*>([^<]*)<\/p>/i,
            ];
            for (const p of descPatterns) {
                const m = html.match(p);
                if (m && m[1].trim() && m[1].trim().length > 10) {
                    description = m[1].trim();
                    break;
                }
            }

            const iconPatterns = [
                /<link[^>]*rel=["']apple-touch-icon["'][^>]*href=["']([^"']*)["'][^>]*>/i,
                /<link[^>]*rel=["'](?:shortcut )?icon["'][^>]*href=["']([^"']*)["'][^>]*>/i,
            ];
            for (const p of iconPatterns) {
                const m = html.match(p);
                if (m && m[1].trim()) {
                    iconUrl = m[1].trim();
                    break;
                }
            }

            if (iconUrl && !iconUrl.startsWith('http')) {
                try {
                    const u = new URL(baseUrl);
                    iconUrl = new URL(iconUrl, u.origin).href;
                } catch {}
            }
            if (!iconUrl) iconUrl = getFaviconUrl(baseUrl);
            if (!title) {
                try {
                    const u = new URL(baseUrl);
                    title = u.hostname;
                } catch {}
            }
            if (!description) description = title || '暂无描述';

            return { title, description, icon: iconUrl };
        }

        // ============================================
        // 工具函数
        // ============================================
        function getFaviconUrl(url) {
            try {
                const u = new URL(url);
                return `${u.origin}/favicon.ico`;
            } catch {
                return '';
            }
        }

        function displayResult(info, originalUrl) {
            previewCard.innerHTML = `
                <div class="preview-card">
                    <img class="favicon" src="${info.icon}" onerror="this.style.display='none'" alt="favicon" />
                    <div class="info">
                        <div class="title">${escapeHtml(info.title)}</div>
                        <div class="url">${escapeHtml(originalUrl)}</div>
                        <div class="desc">${escapeHtml(info.description)}</div>
                    </div>
                </div>
            `;

            titleDisplay.innerHTML = escapeHtml(info.title);
            descDisplay.innerHTML = escapeHtml(info.description);
            iconDisplay.innerHTML = `
                <img class="icon-preview" src="${info.icon}" onerror="this.style.display='none'" alt="icon" />
                <span style="word-break:break-all">${escapeHtml(info.icon)}</span>
            `;
            urlDisplay.innerHTML = `<a href="${escapeHtml(originalUrl)}" target="_blank">${escapeHtml(originalUrl)}</a>`;
            resultEl.classList.add('show');
        }

        function showStatus(message, type) {
            statusEl.textContent = message;
            statusEl.className = 'status';
            if (type) statusEl.classList.add(type);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
