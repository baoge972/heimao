async function decrypt(password) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('tree-generator-salt-v1'), iterations: 100000, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const iv = Uint8Array.from(atob(ENC.iv), c => c.charCodeAt(0));
  const data = Uint8Array.from(atob(ENC.data), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return JSON.parse(new TextDecoder().decode(plain));
}

function toMarkdown(node, depth = 0) {
  const indent = '  '.repeat(depth);
  const label = node.url ? '[' + node.name + '](' + node.url + ')' : node.name;
  let md = indent + '- ' + label + '\n';
  if (node.children) for (const c of node.children) md += toMarkdown(c, depth + 1);
  return md;
}

document.getElementById('unlock').addEventListener('click', async () => {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const tree = await decrypt(pwd);
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    const md = toMarkdown(tree);
    const { Markmap } = window.markmap;
    const mm = Markmap.create('#mindmap', { autoFit: true, duration: 300 });
    mm.setData(md);
  } catch (e) {
    err.textContent = '密码错误或数据损坏';
  }
});

document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('unlock').click();
});
