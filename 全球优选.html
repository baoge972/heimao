<script>
    // ========== API模式检测 ==========
    const urlParams = new URLSearchParams(window.location.search);
    const apiCountries = urlParams.get('countries');
    
    if (apiCountries) {
        document.body.innerHTML = '';
        document.body.className = 'api-output-body';
        
        const PROXY_URL = 'https://proxy.030101.xyz/';
        const SOURCES = {
            kulao: { url: 'https://zip.cm.edu.kg/all.txt', needProxy: true, name: '裤佬源' },
            baoge: { url: 'https://qqyx.bgyy.dpdns.org/all.txt', needProxy: true, name: '宝哥聚合源' }
        };
        const countryMeta = {
            "US": "🇺🇸美国", "JP": "🇯🇵日本", "DE": "🇩🇪德国", "GB": "🇬🇧英国", "FR": "🇫🇷法国",
            "CA": "🇨🇦加拿大", "AU": "🇦🇺澳大利亚", "SG": "🇸🇬新加坡", "KR": "🇰🇷韩国", "NL": "🇳🇱荷兰",
            "HK": "🇭🇰中国香港", "TW": "🇹🇼中国台湾", "RU": "🇷🇺俄罗斯", "BR": "🇧🇷巴西", "IN": "🇮🇳印度",
            "IT": "🇮🇹意大利", "ES": "🇪🇸西班牙", "MX": "🇲🇽墨西哥", "ID": "🇮🇩印尼", "TR": "🇹🇷土耳其"
        };
        const apiLimit = urlParams.get('limit');
        const apiSource = urlParams.get('source') || 'baoge';
        const limit = parseInt(apiLimit) || 6;
        const countries = apiCountries.split('-').map(c => c.trim().toUpperCase()).filter(Boolean);
        
        (async function() {
            try {
                const sourceConfig = SOURCES[apiSource] || SOURCES.baoge;
                const fetchUrl = sourceConfig.needProxy ? PROXY_URL + sourceConfig.url : sourceConfig.url;
                const resp = await fetch(fetchUrl);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const rawText = await resp.text();
                const ipStore = {};
                for (const line of rawText.split('\n')) {
                    const trimmed = line.trim();
                    if (trimmed && trimmed.includes('#')) {
                        const hashIdx = trimmed.lastIndexOf('#');
                        const ipPort = trimmed.substring(0, hashIdx).trim();
                        const country = trimmed.substring(hashIdx + 1).trim().toUpperCase();
                        if (ipPort && country) {
                            if (!ipStore[country]) ipStore[country] = [];
                            ipStore[country].push(ipPort);
                        }
                    }
                }
                const resultLines = [];
                for (const code of countries) {
                    const ips = ipStore[code];
                    if (!ips) continue;
                    for (var i = 0; i < Math.min(ips.length, limit); i++) {
                        resultLines.push(ips[i] + '#' + (countryMeta[code] || code));
                    }
                }
                document.body.innerText = resultLines.join('\n') || '# 未找到匹配的节点';
                return;
            } catch (err) {
                document.body.innerText = '# 获取数据失败: ' + err.message + '\n# 请检查网络连接后重试';
                return;
            }
        })();
        throw new Error('API_MODE_STOP');
    }
</script>

                </div>
                <button id="buildApiBtn" class="w-full py-3.5 bg-gradient-to-r from-cyan-600 to-indigo-700 hover:from-cyan-500 hover:to-indigo-600 text-white font-black tracking-widest rounded-xl shadow-lg transition-all text-sm uppercase mb-5 active:scale-[0.98]">⚡ 动态生成订阅 API</button>
                <div id="previewPanel" class="hidden mt-5 space-y-4">
                    <div class="border-t border-slate-800 pt-3">
                        <div class="flex-between mb-2"><span class="text-xs font-bold text-slate-400">🔗 专属订阅链接</span><button id="copyLinkTrigger" class="btn-copy-green">📋 复制链接</button></div>
                        <textarea id="apiLinkOutput" readonly rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 font-mono text-xs text-slate-300 resize-none select-all"></textarea>
                        <p class="text-[10px] text-slate-500 mt-1">💡 提示：订阅链接可在支持文本订阅的客户端中使用</p>
                    </div>
                    <div>
                        <div class="flex-between mb-2 flex-wrap gap-2"><span class="text-xs font-bold text-slate-400">📋 实时节点预览</span><div class="flex gap-2"><button id="copyIpsTrigger" class="btn-copy-green">📋 复制全部</button><button id="togglePreviewFormat" class="btn-copy-green" style="background: linear-gradient(105deg, #3b82f6, #2563eb);">🔄 切换英文逗号格式</button></div></div>
                        <textarea id="ipsPreview" readonly rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 font-mono text-xs text-emerald-400 select-all resize-none custom-scroll"></textarea>
                        <p id="previewFormatHint" class="text-[9px] text-slate-500 mt-1 text-right"><span class="format-badge" id="formatBadge">📄 标准模式(逐行)</span></p>
                    </div>
                </div>
            </div>
            <button id="manualSyncBtn" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 rounded-xl transition-all active:scale-95">🔄 强制同步总控数据源</button>
        </aside>
    </main>

    <footer class="border-t border-slate-800/70 py-6 text-center text-[11px] text-slate-500 tracking-wide mt-8">
        <div class="footer-content">
            <span>© 2026 宝哥全球优选IP · 极速动态节点引擎</span>
            <a href="https://git.baoge.wang/%E6%95%99%E7%A8%8B/%E4%BC%98%E9%80%89IPV4%E5%9F%9F%E5%90%8D-%E6%89%B9%E9%87%8F%E6%A0%87%E6%B3%A8%E5%B7%A5%E5%85%B7.html" target="_blank" rel="noopener noreferrer" class="friend-link-btn">🌟标注</a>
            <a href="https://ip.jsnzkpg.ccwu.cc/" target="_blank" rel="noopener noreferrer" class="friend-link-btn">🔯裤佬</a>
        </div>
    </footer>
    <div id="floatMsg" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800/90 backdrop-blur-md border border-cyan-600 text-white text-xs font-bold py-2.5 px-5 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none flex items-center gap-2 z-50 whitespace-nowrap"><span class="text-cyan-400">⚡</span><span id="floatMsgText">操作成功</span></div>
</div>

<script>
    // UI模式初始化
    if (!apiCountries) {
        (function() {
            document.getElementById('uiContent').style.display = 'block';
            
            const PROXY_URL = 'https://proxy.030101.xyz/';
            const SOURCES = {
                kulao: { url: 'https://zip.cm.edu.kg/all.txt', needProxy: true, name: '裤佬源' },
                baoge: { url: 'https://qqyx.bgyy.dpdns.org/all.txt', needProxy: true, name: '宝哥聚合源' }
            };
            const fullMeta = {
                "HK":"🇭🇰中国香港","JP":"🇯🇵日本","SG":"🇸🇬新加坡","US":"🇺🇸美国","DE":"🇩🇪德国",
                "GB":"🇬🇧英国","FR":"🇫🇷法国","CA":"🇨🇦加拿大","AU":"🇦🇺澳大利亚","KR":"🇰🇷韩国",
                "NL":"🇳🇱荷兰","TW":"🇹🇼中国台湾","RU":"🇷🇺俄罗斯","BR":"🇧🇷巴西","IN":"🇮🇳印度",
                "IT":"🇮🇹意大利","ES":"🇪🇸西班牙","MX":"🇲🇽墨西哥","ID":"🇮🇩印尼","TR":"🇹🇷土耳其"
            };
            let currentSource = 'baoge';
            let currentMinCount = 10;
            let showFiltered = true;
            let globalIpStore = {};
            let totalCountryCount = 0;
            const currentDomain = window.location.origin;
            const currentPath = window.location.pathname;
            let commaPreviewMode = false;
            
            const loadingDiv = document.getElementById('loadingOverlay');
            const bricksGrid = document.getElementById('countryBricksGrid');
            const selectedCounterSpan = document.getElementById('selectedCounter');
            const globalLimitInput = document.getElementById('globalExtractLimit');
            const applyGlobalBtn = document.getElementById('applyGlobalLimit');
            const buildApiBtn = document.getElementById('buildApiBtn');
            const manualSync = document.getElementById('manualSyncBtn');
            const selectAllBtn = document.getElementById('batchSelectAll');
            const clearAllBtn = document.getElementById('batchClear');
            const previewPanel = document.getElementById('previewPanel');
            const apiLinkOutput = document.getElementById('apiLinkOutput');
            const ipsPreview = document.getElementById('ipsPreview');
            const searchInput = document.getElementById('countrySearch');
            const searchInfoDiv = document.getElementById('searchResultsInfo');
            const filterNotice = document.getElementById('filterNotice');
            const minCountDisplay = document.getElementById('minCountDisplay');
            const showAllBtn = document.getElementById('showAllBtn');
            const minCountryCountInput = document.getElementById('minCountryCount');
            const applyFilterBtn = document.getElementById('applyFilterBtn');
            const toggleFormatBtn = document.getElementById('togglePreviewFormat');
            const formatBadge = document.getElementById('formatBadge');
            
            function showMessage(msg, isErr) {
                const toast = document.getElementById('floatMsg');
                const textSpan = document.getElementById('floatMsgText');
                textSpan.innerText = msg;
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
                if (isErr) toast.style.borderColor = '#f43f5e';
                else toast.style.borderColor = '#06b6d4';
                setTimeout(function() {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                    if (isErr) toast.style.borderColor = '';
                }, 2500);
            }
            
            document.getElementById('sourceKulao').addEventListener('click', function() {
                currentSource = 'kulao';
                document.getElementById('sourceKulao').classList.add('active');
                document.getElementById('sourceBaoge').classList.remove('active');
                fetchMasterData();
                showMessage('已切换到裤佬源');
            });
            document.getElementById('sourceBaoge').addEventListener('click', function() {
                currentSource = 'baoge';
                document.getElementById('sourceBaoge').classList.add('active');
                document.getElementById('sourceKulao').classList.remove('active');
                fetchMasterData();
                showMessage('已切换到宝哥聚合源');
            });
            
            async function fetchMasterData() {
                try {
                    loadingDiv.classList.remove('hidden');
                    bricksGrid.classList.add('hidden');
                    const source = SOURCES[currentSource];
                    const fetchUrl = source.needProxy ? PROXY_URL + source.url : source.url;
                    const resp = await fetch(fetchUrl);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const rawText = await resp.text();
                    const newStore = {};
                    for (const line of rawText.split('\n')) {
                        const trimmed = line.trim();
                        if (trimmed && trimmed.includes('#')) {
                            const hashIdx = trimmed.lastIndexOf('#');
                            const ipPort = trimmed.substring(0, hashIdx).trim();
                            const country = trimmed.substring(hashIdx + 1).trim().toUpperCase();
                            if (ipPort && country) {
                                if (!newStore[country]) newStore[country] = [];
                                newStore[country].push(ipPort.trim());
                            }
                        }
                    }
                    globalIpStore = newStore;
                    renderCountryList();
                    showMessage('✅ ' + source.name + '同步成功，共 ' + Object.keys(globalIpStore).length + ' 个地区节点');
                } catch (err) {
                    showMessage('❌ 数据同步失败: ' + err.message, true);
                    loadingDiv.innerText = '⚠️ 连接总控失败';
                    loadingDiv.classList.remove('animate-pulse');
                } finally {
                    loadingDiv.classList.add('hidden');
                    bricksGrid.classList.remove('hidden');
                }
            }
            
            function renderCountryList() {
                bricksGrid.innerHTML = '';
                var sortedCodes = Object.keys(globalIpStore).sort(function(a,b) {
                    return (fullMeta[a] || a).localeCompare(fullMeta[b] || b, 'zh-CN');
                });
                var displayCodes = showFiltered ? sortedCodes.filter(function(c) { return globalIpStore[c].length >= currentMinCount; }) : sortedCodes;
                var searchTerm = searchInput.value.trim();
                if (searchTerm) {
                    var keywords = searchTerm.split(/[\s\/,]+/).filter(function(k){ return k; });
                    displayCodes = displayCodes.filter(function(code) {
                        return keywords.some(function(kw) {
                            return (fullMeta[code] || code).toLowerCase().includes(kw.toLowerCase()) ||
                                   code.toLowerCase().includes(kw.toLowerCase());
                        });
                    });
                }
                totalCountryCount = displayCodes.length;
                var defaultLimit = globalLimitInput.value || 6;
                if (showFiltered && currentMinCount > 1 && sortedCodes.length !== displayCodes.length) {
                    filterNotice.style.display = 'flex';
                } else { filterNotice.style.display = 'none'; }
                minCountDisplay.innerText = currentMinCount;
                searchInfoDiv.innerHTML = searchTerm ? (displayCodes.length === 0 ? '❌ 无匹配' : '🔍 找到 ' + displayCodes.length + ' 个国家') : '';
                for (var i = 0; i < displayCodes.length; i++) {
                    var code = displayCodes[i];
                    var nodeCount = globalIpStore[code].length;
                    var displayName = fullMeta[code] || ('🌐 ' + code);
                    var brick = document.createElement('div');
                    brick.className = 'country-brick flex items-center gap-2 bg-slate-800/70 border border-slate-700 rounded-xl cursor-pointer hover:border-cyan-500 transition-all select-none shadow-sm';
                    brick.setAttribute('data-country-code', code);
                    brick.innerHTML = '<input type="checkbox" class="country-checker" value="' + code + '"><span class="country-name flex items-center gap-1.5"><span>' + displayName + '</span><span class="country-count">' + nodeCount + '</span></span><input type="number" data-country-limit="' + code + '" value="' + defaultLimit + '" min="1" max="' + nodeCount + '" class="limit-per-country ml-auto bg-slate-950 border border-slate-600 rounded-lg text-center text-sm font-bold text-cyan-400" onclick="event.stopPropagation();">';
                    brick.addEventListener('click', (function(b) {
                        return function(e) {
                            if (e.target.classList && e.target.classList.contains('limit-per-country')) return;
                            var cb = b.querySelector('.country-checker');
                            cb.checked = !cb.checked;
                            if (cb.checked) b.classList.add('active-brick');
                            else b.classList.remove('active-brick');
                            updateSelectedCounter();
                        };
                    })(brick));
                    bricksGrid.appendChild(brick);
                }
                updateSelectedCounter();
            }
            
            function updateSelectedCounter() {
                var checked = document.querySelectorAll('.country-brick .country-checker:checked').length;
                selectedCounterSpan.innerText = checked + ' / ' + totalCountryCount;
            }
            
            function setAllSelected(sel) {
                document.querySelectorAll('.country-brick').forEach(function(b) {
                    var cb = b.querySelector('.country-checker');
                    if (cb) {
                        cb.checked = sel;
                        if (sel) b.classList.add('active-brick');
                        else b.classList.remove('active-brick');
                    }
                });
                updateSelectedCounter();
                showMessage(sel ? '全选完成' : '已清空');
            }
            
            function applyGlobalLimitToAll() {
                var val = globalLimitInput.value;
                document.querySelectorAll('.limit-per-country').forEach(function(inp) { inp.value = val; });
                showMessage('统一提取数量为 ' + val);
            }
            
            function applyFilter() {
                var newMin = parseInt(minCountryCountInput.value);
                if (!newMin || newMin < 1) { showMessage('无效阈值', true); return; }
                currentMinCount = newMin;
                showFiltered = true;
                renderCountryList();
                showMessage('过滤 ≥ ' + currentMinCount + ' 节点');
            }
            
            function showAllCountries() {
                showFiltered = false;
                renderCountryList();
                showMessage('显示全部国家');
            }
            
            function updatePreviewContent(selectedBricks) {
                var allNodes = [];
                for (var i = 0; i < selectedBricks.length; i++) {
                    var brick = selectedBricks[i];
                    var code = brick.getAttribute('data-country-code');
                    if (!code || !globalIpStore[code]) continue;
                    var limitInput = brick.querySelector('.limit-per-country');
                    var perLimit = parseInt(limitInput ? limitInput.value : null) || parseInt(globalLimitInput.value) || 6;
                    var ips = globalIpStore[code].slice(0, perLimit);
                    var remark = fullMeta[code] || code;
                    for (var j = 0; j < ips.length; j++) {
                        allNodes.push(ips[j] + '#' + remark);
                    }
                }
                if (commaPreviewMode) ipsPreview.value = allNodes.join(',');
                else ipsPreview.value = allNodes.join('\n');
            }
            
            function generateSubscriptionAndPreview() {
                var selectedBricks = Array.from(document.querySelectorAll('.country-brick')).filter(function(b) {
                    return b.querySelector('.country-checker') && b.querySelector('.country-checker').checked;
                });
                if (selectedBricks.length === 0) { showMessage('请至少勾选一个地区', true); return false; }
                var selectedCodes = [];
                for (var i = 0; i < selectedBricks.length; i++) {
                    var code = selectedBricks[i].getAttribute('data-country-code');
                    if (code) selectedCodes.push(code);
                }
                var countryPath = selectedCodes.join('-');
                var globalLimit = globalLimitInput.value || 6;
                var apiEndpoint = currentDomain + currentPath + '?countries=' + countryPath + '&limit=' + globalLimit + '&source=' + currentSource;
                apiLinkOutput.value = apiEndpoint;
                updatePreviewContent(selectedBricks);
                previewPanel.classList.remove('hidden');
                showMessage('订阅链接生成，' + selectedCodes.length + '个地区');
                return true;
            }
            
            function togglePreviewFormat() {
                commaPreviewMode = !commaPreviewMode;
                if (commaPreviewMode) {
                    formatBadge.innerHTML = '📑 英文逗号模式(一行,隔开)';
                    formatBadge.style.background = '#0f172a';
                } else {
                    formatBadge.innerHTML = '📄 标准模式(逐行)';
                    formatBadge.style.background = '#1e293b';
                }
                var selectedBricks = Array.from(document.querySelectorAll('.country-brick')).filter(function(b) {
                    return b.querySelector('.country-checker') && b.querySelector('.country-checker').checked;
                });
                if (selectedBricks.length > 0) updatePreviewContent(selectedBricks);
                showMessage('预览格式已切换: ' + (commaPreviewMode ? '英文逗号分隔(一行)' : '标准换行模式'));
            }
            
            function copyToClipboard(text, successMsg) {
                navigator.clipboard.writeText(text).then(function() { showMessage(successMsg); }).catch(function() { showMessage('复制失败', true); });
            }
            
            selectAllBtn.addEventListener('click', function() { setAllSelected(true); });
            clearAllBtn.addEventListener('click', function() { setAllSelected(false); });
            applyGlobalBtn.addEventListener('click', function() {
                applyGlobalLimitToAll();
                var selected = Array.from(document.querySelectorAll('.country-brick')).filter(function(b) {
                    return b.querySelector('.country-checker') && b.querySelector('.country-checker').checked;
                });
                if (selected.length) updatePreviewContent(selected);
            });
            buildApiBtn.addEventListener('click', function() { generateSubscriptionAndPreview(); });
            manualSync.addEventListener('click', function() { fetchMasterData(); });
            applyFilterBtn.addEventListener('click', function() { applyFilter(); });
            showAllBtn.addEventListener('click', function() { showAllCountries(); });
            document.getElementById('copyLinkTrigger').addEventListener('click', function() {
                if (apiLinkOutput.value) copyToClipboard(apiLinkOutput.value, '订阅链接已复制');
                else showMessage('无有效链接', true);
            });
            document.getElementById('copyIpsTrigger').addEventListener('click', function() {
                if (ipsPreview.value) copyToClipboard(ipsPreview.value, '节点列表已复制');
                else showMessage('无预览数据', true);
            });
            if (toggleFormatBtn) {
                toggleFormatBtn.addEventListener('click', function() { togglePreviewFormat(); });
            }
            if (searchInput) {
                var timer;
                searchInput.addEventListener('input', function() {
                    clearTimeout(timer);
                    timer = setTimeout(function() { renderCountryList(); }, 300);
                });
            }
            fetchMasterData();
        })();
    }
</script>
</body>
</html>
