            "NZ": "🇳🇿新西兰", "OM": "🇴🇲阿曼", "PA": "🇵🇦巴拿马", "PE": "🇵🇪秘鲁", "PG": "🇵🇬巴布亚新几内亚", "PH": "🇵🇭菲律宾",
            "PK": "🇵🇰巴基斯坦", "PL": "🇵🇱波兰", "PT": "🇵🇹葡萄牙", "PW": "🇵🇼帕劳", "PY": "🇵🇾巴拉圭", "QA": "🇶🇦卡塔尔",
            "RO": "🇷🇴罗马尼亚", "RS": "🇷🇸塞尔维亚", "RU": "🇷🇺俄罗斯", "RW": "🇷🇼卢旺达", "SA": "🇸🇦沙特阿拉伯", "SB": "🇸🇧所罗门群岛",
            "SC": "🇸🇨塞舌尔", "SD": "🇸🇩苏丹", "SE": "🇸🇪瑞典", "SG": "🇸🇬新加坡", "SI": "🇸🇮斯洛文尼亚", "SK": "🇸🇰斯洛伐克",
            "SL": "🇸🇱塞拉利昂", "SM": "🇸🇲圣马力诺", "SN": "🇸🇳塞内加尔", "SO": "🇸🇴索马里", "SR": "🇸🇷苏里南", "SS": "🇸🇸南苏丹",
            "ST": "🇸🇹圣多美和普林西比", "SV": "🇸🇻萨尔瓦多", "SY": "🇸🇾叙利亚", "SZ": "🇸🇿斯威士兰", "TD": "🇹🇩乍得", "TG": "🇹🇬多哥",
            "TH": "🇹🇭泰国", "TJ": "🇹🇯塔吉克斯坦", "TL": "🇹🇱东帝汶", "TM": "🇹🇲土库曼斯坦", "TN": "🇹🇳突尼斯", "TO": "🇹🇴汤加",
            "TR": "🇹🇷土耳其", "TT": "🇹🇹特立尼达和多哥", "TV": "🇹🇻图瓦卢", "TW": "🇹🇼中国台湾", "TZ": "🇹🇿坦桑尼亚", "UA": "🇺🇦乌克兰",
            "UG": "🇺🇬乌干达", "US": "🇺🇸美国", "UY": "🇺🇾乌拉圭", "UZ": "🇺🇿乌兹别克斯坦", "VA": "🇻🇦梵蒂冈", "VC": "🇻🇨圣文森特",
            "VE": "🇻🇪委内瑞拉", "VN": "🇻🇳越南", "VU": "🇻🇺瓦努阿图", "WS": "🇼🇸萨摩亚", "YE": "🇾🇪也门", "ZA": "🇿🇦南非",
            "ZM": "🇿🇲赞比亚", "ZW": "🇿🇼津巴布韦"
        };
        
        let globalIpStore = {};
        let totalCountryCount = 0;
        const currentDomain = window.location.origin;
        
        const loadingDiv = document.getElementById('loadingOverlay');
        const bricksGrid = document.getElementById('countryBricksGrid');
        const selectedCounterSpan = document.getElementById('selectedCounter');
        const globalLimitInput = document.getElementById('globalExtractLimit');
        const applyGlobalBtn = document.getElementById('applyGlobalLimit');
        const buildApiBtn = document.getElementById('buildApiBtn');
        const manualSync = document.getElementById('manualSyncBtn');
        const selectAllBtn = document.getElementById('batchSelectAll');
        const clearAllBtn = document.getElementById('batchClear');
        const previewPanel = document.getElementById('previewPanel');
        const apiLinkOutput = document.getElementById('apiLinkOutput');
        const ipsPreview = document.getElementById('ipsPreview');
        
        function showMessage(msg, isErr = false) {
            const toast = document.getElementById('floatMsg');
            const textSpan = document.getElementById('floatMsgText');
            textSpan.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            if (isErr) toast.style.borderColor = '#f43f5e';
            else toast.style.borderColor = '#06b6d4';
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
                if (isErr) toast.style.borderColor = '';
            }, 2500);
        }
        
        async function fetchMasterData() {
            try {
                loadingDiv.classList.remove('hidden');
                bricksGrid.classList.add('hidden');
                const proxyFetchUrl = PROXY_URL + MASTER_API;
                const resp = await fetch(proxyFetchUrl);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const rawText = await resp.text();
                const newStore = {};
                const lines = rawText.split('\n');
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed && trimmed.includes('#')) {
                        const [ipPort, countryCodeRaw] = trimmed.split('#');
                        const country = countryCodeRaw.trim().toUpperCase();
                        if (ipPort && country) {
                            if (!newStore[country]) newStore[country] = [];
                            newStore[country].push(ipPort.trim());
                        }
                    }
                }
                globalIpStore = newStore;
                renderCountryList();
                showMessage(`✅ 同步成功，共加载 ${Object.keys(globalIpStore).length} 个地区节点`);
            } catch (err) {
                showMessage(`❌ 数据同步失败: ${err.message}`, true);
                loadingDiv.innerText = '⚠️ 连接宝哥总控失败，请稍后重试';
                loadingDiv.classList.remove('animate-pulse');
            } finally {
                loadingDiv.classList.add('hidden');
                bricksGrid.classList.remove('hidden');
            }
        }
        
        function renderCountryList() {
            bricksGrid.innerHTML = '';
            const sortedCodes = Object.keys(globalIpStore).sort((a,b) => {
                const nameA = countryMeta[a] || a;
                const nameB = countryMeta[b] || b;
                return nameA.localeCompare(nameB, 'zh-CN');
            });
            totalCountryCount = sortedCodes.length;
            const defaultLimitVal = globalLimitInput.value || 6;
            
            for (let code of sortedCodes) {
                const nodeCount = globalIpStore[code].length;
                const displayName = countryMeta[code] || `🌍 ${code}`;
                const brick = document.createElement('div');
                brick.className = "country-brick flex items-center gap-2 bg-slate-800/70 border border-slate-700 rounded-xl cursor-pointer hover:border-cyan-500 transition-all select-none shadow-sm";
                brick.setAttribute('data-country-code', code);
                brick.innerHTML = `
                    <input type="checkbox" class="country-checker" value="${code}">
                    <span class="country-name flex items-center gap-1.5">
                        <span>${displayName}</span>
                        <span class="country-count text-[11px] bg-slate-950/80 px-2 py-0.5 rounded-full text-slate-300">${nodeCount}</span>
                    </span>
                    <input type="number" data-country-limit="${code}" value="${defaultLimitVal}" min="1" max="${nodeCount}" 
                           class="limit-per-country ml-auto bg-slate-950 border border-slate-600 rounded-lg text-center text-sm font-bold text-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                           onclick="event.stopPropagation();">
                `;
                brick.addEventListener('click', (e) => {
                    if (e.target.classList && (e.target.classList.contains('limit-per-country') || e.target.classList.contains('country-count'))) return;
                    const cb = brick.querySelector('.country-checker');
                    cb.checked = !cb.checked;
                    updateBrickActiveStyle(brick, cb.checked);
                    updateSelectedCounter();
                });
                bricksGrid.appendChild(brick);
            }
            updateSelectedCounter();
        }
        
        function updateBrickActiveStyle(brick, isActive) {
            if (isActive) {
                brick.classList.add('active-brick');
                brick.style.borderColor = '#06b6d4';
            } else {
                brick.classList.remove('active-brick');
                brick.style.borderColor = '';
            }
        }
        
        function updateSelectedCounter() {
            const allBricks = document.querySelectorAll('.country-brick');
            let checkedCount = 0;
            allBricks.forEach(brick => {
                const cb = brick.querySelector('.country-checker');
                if (cb && cb.checked) checkedCount++;
            });
            selectedCounterSpan.innerText = `${checkedCount} / ${totalCountryCount}`;
        }
        
        function setAllSelected(selected) {
            const allBricks = document.querySelectorAll('.country-brick');
            allBricks.forEach(brick => {
                const cb = brick.querySelector('.country-checker');
                if (cb) {
                    cb.checked = selected;
                    updateBrickActiveStyle(brick, selected);
                }
            });
            updateSelectedCounter();
            showMessage(selected ? '✔️ 已全选所有地区' : '🗑️ 已清空地区勾选');
        }
        
        function applyGlobalLimitToAll() {
            const globalVal = globalLimitInput.value;
            if (!globalVal || globalVal < 1) return;
            const allLimitInputs = document.querySelectorAll('.limit-per-country');
            allLimitInputs.forEach(inp => {
                inp.value = globalVal;
            });
            showMessage(`⚙️ 已将单个地区提取数统一为 ${globalVal}`);
        }
        
        function generateSubscription() {
            const selectedBricks = Array.from(document.querySelectorAll('.country-brick')).filter(brick => {
                const cb = brick.querySelector('.country-checker');
                return cb && cb.checked;
            });
            if (selectedBricks.length === 0) {
                showMessage('❌ 请至少勾选一个地区节点', true);
                return;
            }
            const selectedCodes = [];
            for (let brick of selectedBricks) {
                const code = brick.getAttribute('data-country-code');
                if (code) selectedCodes.push(code);
            }
            const countryPath = selectedCodes.join('-');
            const globalLimit = globalLimitInput.value || 6;
            const apiEndpoint = `${currentDomain}/edgetunnel/${countryPath}?limit=${globalLimit}`;
            apiLinkOutput.value = apiEndpoint;
            
            let previewLines = [];
            for (let brick of selectedBricks) {
                const code = brick.getAttribute('data-country-code');
                if (!code || !globalIpStore[code]) continue;
                const limitInput = brick.querySelector('.limit-per-country');
                let perLimit = parseInt(limitInput?.value) || parseInt(globalLimitInput.value) || 6;
                const ipList = globalIpStore[code];
                const limitedIps = ipList.slice(0, perLimit);
                const remark = countryMeta[code] || `🌐${code}`;
                for (let ip of limitedIps) {
                    previewLines.push(`${ip}#${remark}`);
                }
            }
            ipsPreview.value = previewLines.join('\n');
            previewPanel.classList.remove('hidden');
            showMessage(`✨ 订阅链接已生成，选取 ${selectedCodes.length} 个地区`);
        }
        
        function copyToClipboard(text, successMsg) {
            navigator.clipboard.writeText(text).then(() => showMessage(successMsg)).catch(() => showMessage('复制失败，手动选中', true));
        }
        
        function bindEvents() {
            selectAllBtn.addEventListener('click', () => setAllSelected(true));
            clearAllBtn.addEventListener('click', () => setAllSelected(false));
            applyGlobalBtn.addEventListener('click', applyGlobalLimitToAll);
            buildApiBtn.addEventListener('click', generateSubscription);
            manualSync.addEventListener('click', () => fetchMasterData());
            
            const copyLinkBtn = document.getElementById('copyLinkTrigger');
            const copyIpsBtn = document.getElementById('copyIpsTrigger');
            if (copyLinkBtn) {
                copyLinkBtn.addEventListener('click', () => {
                    if (apiLinkOutput.value) copyToClipboard(apiLinkOutput.value, '🔗 订阅链接已复制');
                    else showMessage('无有效链接，请先生成', true);
                });
            }
            if (copyIpsBtn) {
                copyIpsBtn.addEventListener('click', () => {
                    if (ipsPreview.value) copyToClipboard(ipsPreview.value, '📋 节点列表已复制');
                    else showMessage('无预览数据', true);
                });
            }
        }
        
        function init() {
            bindEvents();
            fetchMasterData();
        }
        
        init();
    </script>
</body>
