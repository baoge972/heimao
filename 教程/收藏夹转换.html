<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔖 书签图标添加工具 | 不拆分，只加图标</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fc 0%, #e9eef5 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-card {
            max-width: 780px;
            width: 100%;
            background: rgba(255,255,255,0.96);
            border-radius: 2rem;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2);
            overflow: hidden;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .card-header {
            padding: 1.8rem 2rem;
            background: linear-gradient(120deg, #ffffff, #f8fafd);
            border-bottom: 1px solid #eef2f8;
        }

        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f3a5f, #2c6280);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header h1::before {
            content: "📖";
            background: none;
            -webkit-background-clip: unset;
            color: #2c6280;
        }

        .sub {
            color: #4e6f8f;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            padding-left: 0.8rem;
            border-left: 3px solid #3b82f6;
        }

        .control-panel {
            padding: 1.8rem 2rem;
            background: #ffffff;
            border-bottom: 1px solid #eef2f8;
        }

        .file-row {
            margin-bottom: 1.2rem;
        }

        .label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #4a6f8f;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }

        input[type="file"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 1.2rem;
            border: 1px solid #d4e0ec;
            background: #fefefe;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        input[type="file"]:hover {
            border-color: #3b82f6;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .btn-primary {
            background: #1f3a5f;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 2.2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            background: #2b5478;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }

        .btn-secondary {
            background: #eef2f9;
            border: 1px solid #dce5ef;
            padding: 0.7rem 1.6rem;
            border-radius: 2.2rem;
            font-weight: 500;
            color: #2c4a6e;
            cursor: pointer;
            transition: 0.2s;
        }

        .result-area {
            padding: 1.6rem 2rem 2rem;
            background: #fefefe;
        }

        .status-box {
            background: #f0f7ff;
            border-radius: 1.2rem;
            padding: 1rem 1.4rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #3b82f6;
            font-size: 0.9rem;
            color: #1e4668;
        }

        .download-card {
            background: #fafcff;
            border-radius: 1.2rem;
            border: 1px solid #e9edf2;
            padding: 1.2rem 1.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .file-info {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .file-name {
            font-weight: 700;
            background: #eef2f9;
            padding: 0.25rem 1rem;
            border-radius: 2rem;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .file-size {
            color: #527190;
            font-size: 0.8rem;
        }

        .download-link {
            background: #eef2ff;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            text-decoration: none;
            font-weight: 500;
            color: #1e3a5f;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .download-link:hover {
            background: #e2eaff;
        }

        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.7rem;
            text-align: center;
            color: #6f8dae;
            border-top: 1px solid #edf2f7;
            padding-top: 1.2rem;
        }

        hr {
            display: none;
        }
    </style>
</head>
<body>

<div class="tool-card">
    <div class="card-header">
        <h1>🔗 书签真实图标注入器</h1>
        <div class="sub">· 不拆分文件，保持原始结构 · 自动添加 Google 真实图标链接 · 完美解决图标缺失问题</div>
    </div>

    <div class="control-panel">
        <div class="file-row">
            <div class="label">📂 选择书签文件 (bookmarks.html)</div>
            <input type="file" id="bookmarkFile" accept=".html,.htm">
        </div>
        <div class="btn-group">
            <button class="btn-primary" id="processBtn">✨ 添加图标并导出</button>
            <button class="btn-secondary" id="resetBtn">🗑️ 清空</button>
        </div>
    </div>

    <div class="result-area" id="resultArea">
        <div class="status-box" id="statusMsg">
            💡 就绪 · 选择书签文件后点击「添加图标并导出」
        </div>
        <div id="resultContainer"></div>
        <div class="footer-note">
            ✅ 每个网站自动添加 <code>ICON="https://www.google.com/s2/favicons?domain=xxx&sz=64"</code><br>
            🎨 导入后若图标不满意 → 后台清空图标URL → 自动显示彩色首字母背景
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('bookmarkFile');
    const processBtn = document.getElementById('processBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusMsg = document.getElementById('statusMsg');
    const resultContainer = document.getElementById('resultContainer');

    // 从URL提取domain 并生成图标链接 (纯URL，无base64)
    function getIconUrlFromHref(href) {
        if (!href || typeof href !== 'string') return '';
        try {
            const urlObj = new URL(href);
            const domain = urlObj.hostname;
            if (domain) {
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            }
            return '';
        } catch (e) {
            return '';
        }
    }

    // 核心: 为所有 <A> 标签添加 ICON 属性 (移除旧图标，添加新图标)
    function addIconsToBookmark(originalHtml) {
        // 移除所有已有的 ICON="..." 属性 (避免base64或旧的)
        let cleanedHtml = originalHtml.replace(/ICON="[^"]*"/gi, '');
        
        // 匹配 <A ... HREF="url" ... >  注意各种属性顺序
        const aTagRegex = /<A\s+([^>]*?)HREF="([^"]+)"([^>]*?)>/gi;
        
        let newHtml = cleanedHtml;
        let addedCount = 0;
        
        newHtml = newHtml.replace(aTagRegex, (match, beforeHref, url, afterHref) => {
            const iconUrl = getIconUrlFromHref(url);
            if (iconUrl) {
                addedCount++;
                // 保持原标签结构，添加 ICON 属性在 > 之前
                return `<A ${beforeHref}HREF="${url}"${afterHref} ICON="${iconUrl}">`;
            }
            return match;  // 无效url保持原样
        });
        
        return { html: newHtml, count: addedCount };
    }

    // 下载单个文件
    function downloadFile(content, fileName) {
        const blob = new Blob([content], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // 主流程
    async function processBookmark() {
        if (!fileInput.files || fileInput.files.length === 0) {
            statusMsg.innerHTML = '⚠️ 请先选择 bookmarks.html 文件';
            statusMsg.style.background = "#fff0e0";
            resultContainer.innerHTML = '';
            return;
        }

        const file = fileInput.files[0];
        if (!file.name.toLowerCase().endsWith('.html')) {
            statusMsg.innerHTML = '⚠️ 请选择正确的书签 HTML 文件（.html）';
            return;
        }

        statusMsg.innerHTML = '⏳ 正在解析书签并添加真实图标链接 (Google服务) ...';
        statusMsg.style.background = "#eef4ff";
        resultContainer.innerHTML = '';

        let fileContent;
        try {
            fileContent = await file.text();
        } catch (err) {
            statusMsg.innerHTML = '❌ 读取文件失败，请重试';
            return;
        }

        // 添加图标
        const { html: enrichedHtml, count: addedCount } = addIconsToBookmark(fileContent);
        
        // 计算新文件大小
        const newSizeKB = (new Blob([enrichedHtml]).size / 1024).toFixed(1);
        const oldSizeKB = (file.size / 1024).toFixed(1);
        
        // 生成新文件名
        let newFileName = file.name.replace(/\.html$/i, '_with_icons.html');
        if (newFileName === file.name) newFileName = file.name + '_with_icons.html';
        
        // 显示结果
        statusMsg.innerHTML = `✅ 转换成功！ 已为 ${addedCount} 个链接添加真实图标 · 文件大小 ${oldSizeKB} KB → ${newSizeKB} KB (未拆分，结构完整)`;
        statusMsg.style.background = "#e6f7ec";
        
        resultContainer.innerHTML = `
            <div class="download-card">
                <div class="file-info">
                    <span class="file-name">📄 ${escapeHtml(newFileName)}</span>
                    <span class="file-size">${newSizeKB} KB</span>
                    <span class="file-size" style="background:#eef2f9; padding:0.2rem 0.6rem; border-radius:20px;">✨ 已嵌入 ${addedCount} 个图标链接</span>
                </div>
                <button class="download-link" id="downloadFinalBtn">⬇️ 下载文件 (保留原结构)</button>
            </div>
        `;
        
        // 绑定下载事件
        const downloadBtn = document.getElementById('downloadFinalBtn');
        if (downloadBtn) {
            downloadBtn.addEventListener('click', (e) => {
                downloadFile(enrichedHtml, newFileName);
            });
        }
    }

    // 简单防XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function resetUI() {
        fileInput.value = '';
        resultContainer.innerHTML = '';
        statusMsg.innerHTML = '🧹 已清空，可以重新选择书签文件。';
        statusMsg.style.background = "#f0f7ff";
    }

    processBtn.addEventListener('click', processBookmark);
    resetBtn.addEventListener('click', resetUI);
</script>
</body>
</html>
