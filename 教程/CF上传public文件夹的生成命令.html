<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Hexo 命令复制</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .title {
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #1e1e2f;
        }
        .code {
            background: #1e1e2f;
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', monospace;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            word-break: break-all;
            margin: 12px 0;
            border: 1px solid #333;
        }
        button {
            background: #0a5b4b;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background: #0e6b58;
        }
        .note {
            font-size: 0.85rem;
            color: #555;
            margin-top: 10px;
        }
        hr {
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title">🔍 本地预览（不推送仓库）</div>
    <div class="code" id="cmd1">hexo cl; hexo g; hexo s</div>
    <button onclick="copyText('cmd1')">📋 复制命令</button>
    <div class="note">执行后访问 http://localhost:4000 预览博客</div>
</div>

<div class="card">
    <div class="title">📁 仅生成 public（不本地预览 · 用于 CF 上传）</div>
    <div class="code" id="cmd2">hexo cl; hexo g</div>
    <button onclick="copyText('cmd2')">📋 复制命令</button>
    <div class="note">生成后把 public 文件夹内容上传到 Cloudflare Pages / 服务器</div>
</div>

<div class="card">
    <div class="title">💡 针对（GitHub 被标记）</div>
    <div class="note">
        ✅ 执行 <strong>hexo cl; hexo g</strong> 后，获得 public 文件夹<br>
        ✅ 使用  <strong>Cloudflare Pages Web 上传</strong> 直接部署<br>
        ✅ 完全绕过 GitHub 授权，不需要连接仓库
    </div>
</div>

<script>
    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('✅ 已复制：' + text);
        }).catch(() => {
            alert('手动复制一下吧');
        });
    }
</script>

</body>
</html>
