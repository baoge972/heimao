<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网站信息抓取工具</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 720px;
            width: 100%;
            background: #1a1d27;
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid #2d313e;
        }

        /* ===== 标题 ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 6px;
        }

        /* ===== 输入区域 ===== */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid #2d313e;
            background: #0f1117;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }

        .input-group button {
            padding: 14px 28px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(129, 140, 248, 0.3);
        }

        .input-group button:active {
            transform: scale(0.97);
        }

        /* ===== 加载状态 ===== */
        .loading {
            display: none;
            text-align: center;
            padding: 40px 0;
            color: #94a3b8;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 12px;
            border: 3px solid #2d313e;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 结果卡片 ===== */
        .result {
            display: none;
            margin-top: 24px;
            background: #0f1117;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #2d313e;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result .row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .result .row:last-child {
            margin-bottom: 0;
        }

        .result .label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            min-width: 72px;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .result .value {
            font-size: 15px;
            color: #e2e8f0;
            word-break: break-all;
            line-height: 1.5;
        }

        .result .value a {
            color: #818cf8;
            text-decoration: none;
        }

        .result .value a:hover {
            text-decoration: underline;
        }

        .result .icon-preview {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result .icon-preview img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #1a1d27;
            border: 1px solid #2d313e;
            object-fit: contain;
            padding: 4px;
        }

        .result .icon-preview .fallback {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #2d313e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 20px;
        }

        /* 图标链接 - 小字 */
        .icon-url-value {
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
        }

        /* ===== 错误信息 ===== */
        .error {
            display: none;
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            font-size: 14px;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .container {
                padding: 24px 16px;
            }

            .header h1 {
                font-size: 22px;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group button {
                padding: 12px;
            }

            .result .row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .result .label {
                min-width: unset;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>🔍 网站信息抓取</h1>
            <p>输入网址，自动获取标题、描述和图标</p>
        </div>

        <!-- 输入 -->
        <div class="input-group">
            <input
            type="url"
            id="urlInput"
            placeholder="输入网站链接，例如 https://github.com"
            autofocus
            />
            <button id="fetchBtn">抓取信息</button>
        </div>

        <!-- 加载 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在抓取...</p>
        </div>

        <!-- 错误 -->
        <div class="error" id="error"></div>

        <!-- 结果 -->
        <div class="result" id="result">
            <!-- 标题 -->
            <div class="row">
                <span class="label">📌 标题</span>
                <span class="value" id="titleValue">—</span>
            </div>
            <!-- 描述 -->
            <div class="row">
                <span class="label">📝 描述</span>
                <span class="value" id="descValue">—</span>
            </div>
            <!-- 图标预览 -->
            <div class="row">
                <span class="label">🖼️ 图标</span>
                <div class="icon-preview" id="iconValue">
                    <span class="fallback">🌐</span>
                </div>
            </div>
            <!-- ✅ 图标链接 -->
            <div class="row">
                <span class="label">🔗 图标链接</span>
                <span class="value icon-url-value" id="iconUrlValue">—</span>
            </div>
            <!-- ✅ 跳转缩略图按钮 -->
            <div class="row" style="border: none; background: transparent; padding: 0; margin-top: 4px;">
                <span class="label" style="min-width:72px;"></span>
                <a href="https://dfile.baoge.wang/%E6%96%87%E4%BB%B6%E5%A4%B9/slt1.html" target="_blank" style="display:inline-block;padding:6px 18px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;transition:transform 0.2s;">
                    📷 自动抓取缩略图
                </a>
            </div>
        </div>

        <div class="footer">数据来源: microlink.io · 每日 1000 次免费请求</div>
    </div>

    <script>
        // ============================================================
        // DOM 引用
        // ============================================================

        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');

        const titleValue = document.getElementById('titleValue');
        const descValue = document.getElementById('descValue');
        const iconValue = document.getElementById('iconValue');
        const iconUrlValue = document.getElementById('iconUrlValue');

        // ============================================================
        // 输入框事件绑定（左键清空 · 右键清空+保留粘贴）
        // ============================================================

        // 左键点击：清空输入框
        urlInput.addEventListener('click', function(e) {
            if (e.button === 0) {
                this.value = '';
            }
        });

        // 右键点击：清空输入框 + 保留系统右键菜单（含粘贴）
        urlInput.addEventListener('contextmenu', function(e) {
            this.value = '';
            // 不阻止默认行为，右键菜单正常显示
        });

        // 回车触发抓取
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleFetch();
            }
        });

        // 自动聚焦
        urlInput.focus();

        // ============================================================
        // 格式化 URL（自动补全协议）
        // ============================================================
        function formatUrl(input) {
            let url = input.trim();
            if (!url) return null;
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }
            try {
                return new URL(url).toString();
            } catch {
                return null;
            }
        }

        // ============================================================
        // 抓取元数据（使用 microlink.io）
        // ============================================================
        async function fetchMetadata(url) {
            const encoded = encodeURIComponent(url);
            const apiUrl = `https://api.microlink.io/?url=${encoded}&screenshot=false&embed=false`;

            const res = await fetch(apiUrl);
            if (!res.ok) {
                const text = await res.text();
                throw new Error(`API 请求失败 (${res.status}): ${text.slice(0, 80)}`);
            }

            const data = await res.json();

            if (data.status === 'fail' || !data.data) {
                throw new Error(data.message || '无法获取该网站信息');
            }

            const d = data.data;

            return {
                title: d.title || d.site || d.publisher || '无标题',
                description: d.description || d.lead || d.excerpt || '无描述',
                icon: d.logo?.url || d.image?.url || null,
                url: d.url || url,
            };
        }

        // ============================================================
        // 渲染结果
        // ============================================================
        function renderResult(data) {
            // 标题
            titleValue.textContent = data.title;

            // 描述
            descValue.textContent = data.description;

            // 图标预览
            iconValue.innerHTML = '';
            if (data.icon) {
                const img = document.createElement('img');
                img.src = data.icon;
                img.alt = '图标';
                img.onerror = () => {
                    iconValue.innerHTML = '<span class="fallback">🌐</span>';
                };
                iconValue.appendChild(img);
            } else {
                const fallback = document.createElement('span');
                fallback.className = 'fallback';
                fallback.textContent = '🌐';
                iconValue.appendChild(fallback);
            }

            // 图标链接
            iconUrlValue.textContent = data.icon || '无图标';

            // 显示结果
            result.style.display = 'block';
        }

        // ============================================================
        // 主流程
        // ============================================================
        async function handleFetch() {
            const raw = urlInput.value;
            const url = formatUrl(raw);

            // 隐藏旧结果/错误
            result.style.display = 'none';
            error.style.display = 'none';
            error.textContent = '';

            if (!url) {
                error.textContent = '⚠️ 请输入有效的网址';
                error.style.display = 'block';
                return;
            }

            // 显示加载
            loading.style.display = 'block';
            fetchBtn.disabled = true;
            fetchBtn.textContent = '加载中...';

            try {
                const data = await fetchMetadata(url);
                renderResult(data);
            } catch (err) {
                error.textContent = `⚠️ ${err.message}`;
                error.style.display = 'block';
                console.error(err);
            } finally {
                loading.style.display = 'none';
                fetchBtn.disabled = false;
                fetchBtn.textContent = '抓取信息';
            }
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        fetchBtn.addEventListener('click', handleFetch);

        // ============================================================
        // 示例：预填一个默认网址（取消注释即可自动加载）
        // ============================================================
        // urlInput.value = 'https://github.com';
        // handleFetch();
    </script>

</body>
</html>
